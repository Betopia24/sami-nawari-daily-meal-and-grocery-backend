name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/sami-nawari-daily-meal-and-grocery-backend
            
            # Pull latest changes
            git pull origin main
            
            # Install dependencies and build project
            pnpm install --frozen-lockfile
            pnpm build
            
            # Restart backend server in PM2
            pm2 restart sami-nawari-backend
            pm2 save